# Nginx config for transport.nirdesham.com
#
# Yeh file server par yahan rakhni hai:
#   /etc/nginx/sites-available/transport.nirdesham.com.conf
# aur enable karni hai:
#   sudo ln -s /etc/nginx/sites-available/transport.nirdesham.com.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pehle sirf is HTTP block se start karo. SSL certbot se lagane ke baad
# certbot khud HTTPS (443) block add kar dega aur HTTP ko redirect kar dega.

server {
    listen 80;
    listen [::]:80;
    server_name transport.nirdesham.com;

    # PM2 par chal raha transport-web app (serve -> port 5175)
    location / {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket / upgrade support (future-proof)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    # Gzip — static assets chhote aur fast
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
